<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f2e8;
      --surface: #fffdf7;
      --text: #24231f;
      --muted: #68645b;
      --border: #d8d0c1;
      --accent: #2f6f62;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18201e;
        --surface: #202b28;
        --text: #edf2ee;
        --muted: #afbbb5;
        --border: #3a4944;
        --accent: #8bc6b8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background:
        linear-gradient(var(--border) 1px, transparent 1px),
        var(--bg);
      background-size: 100% 32px;
      font: 16px/1.55 Georgia, "Times New Roman", serif;
    }
    main { width: min(72rem, calc(100% - 2rem)); margin: 0 auto; padding: 3rem 0; }
    h1, h2, h3 { line-height: 1.15; text-wrap: balance; }
    h1 { max-width: 18ch; font-size: clamp(2.4rem, 7vw, 5rem); margin: 0 0 1rem; }
    p { max-width: 70ch; }
    a { color: var(--accent); text-underline-offset: .2em; }
    .surface {
      margin: 1.5rem 0;
      padding: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .5rem;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
    .muted { color: var(--muted); }
    @media (max-width: 40rem) {
      main { width: min(100% - 1rem, 72rem); padding-top: 1.5rem; }
      .surface { padding: 1rem; }
    }
    @media print {
      :root { --bg: white; --surface: white; --text: black; --muted: #444; --border: #bbb; }
      body { background: white; }
      main { width: 100%; padding: 0; }
      a { color: black; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="muted">{{EYEBROW}}</p>
      <h1>{{TITLE}}</h1>
      <p>{{SUMMARY}}</p>
    </header>
    <section class="surface" aria-labelledby="overview">
      <h2 id="overview">Overview</h2>
      <div class="grid">
        {{CONTENT}}
      </div>
    </section>
    <footer class="muted">
      <p>Derived from {{SOURCE_LINKS}}.</p>
    </footer>
  </main>
</body>
</html>
